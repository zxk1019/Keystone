# Weekly pull requests to keep the dependencies and the GitHub Actions up to date. CI checks
# each one. New versions wait two weeks before Dependabot proposes them.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 14
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # A new major version of the emulators can need another Java: update it by hand (see
      # scripts/firebase.cjs)
      - dependency-name: firebase-tools
        update-types: [version-update:semver-major]
      # A new major version of Capacitor also changes the Android project: update it by hand
      - dependency-name: '@capacitor/*'
        update-types: [version-update:semver-major]
      # eslint-plugin-react does not support ESLint 10 yet
      - dependency-name: eslint
        update-types: [version-update:semver-major]
      # typescript-eslint does not support TypeScript 7 yet (it needs the JavaScript API of 6)
      - dependency-name: typescript
        update-types: [version-update:semver-major]
      # The types follow the Node.js of .nvmrc (24), not the newest one
      - dependency-name: '@types/node'
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 14
    groups:
      actions:
        patterns: ['*']
