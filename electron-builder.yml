appId: com.miestudio.app
productName: Keystone
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!docs/**'
  - '!.github/**'
  - '!scripts/*'
  - '!firebase/*'
  # The Android app (Capacitor project and the phone build) is not part of the PC app
  - '!android/**'
  - '!out/mobile/**'
  - '!{capacitor.config.ts,vite.mobile.config.ts,.gitattributes}'
  - '!.claude/**'
  - '!{firebase.json,firebase-debug.log,firestore-debug.log}'
  - '!CLAUDE.md'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!vitest.config.*'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,.nvmrc,dev-app-update.yml}'
  - '!{README.md,README.es.md,CHANGELOG.md,CONTRIBUTING.md,SECURITY.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
asarUnpack:
  # The icons must be real files: Windows reads them for the tray and the notifications
  - resources/**
win:
  # Keeps the name of when the app was Mi Estudio: on an update the installer keeps the old
  # shortcuts (it only renames them), and they point to this file
  executableName: mi-estudio
nsis:
  # One click, only for the current user: no administrator permission needed
  oneClick: true
  perMachine: false
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
  # Uninstalling keeps the user's data (%APPDATA%\Mi Estudio: the folder keeps the old name)
  deleteAppDataOnUninstall: false
  # Removes what the app registers with Windows (miestudio:// links, start with Windows)
  include: build/installer.nsh
npmRebuild: false
# New versions are GitHub Releases (made by .github/workflows/release.yml). electron-builder
# writes latest.yml next to the installer and app-update.yml inside the app, and the app
# (src/main/updater.ts) reads them to find and check the new installer.
publish:
  provider: github
  owner: zxk1019
  repo: Keystone
  releaseType: release
